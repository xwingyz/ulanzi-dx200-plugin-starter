name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The test suite relies on node:test async semantics from current
        # Node; older lines (20/22) report pending-promise failures. Track
        # the version the project actually targets.
        node-version: [24]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # The test suite imports runtime modules (ws, mqtt, …) from every
      # plugin and the template, so their dependencies must be installed
      # before running tests. Plugins with a lockfile use npm ci; those
      # without one (and the template) use npm install.
      - name: Install lexutility plugin dependencies
        working-directory: plugins/com.ulanzi.lexutility.ulanziPlugin
        run: npm ci --registry https://registry.npmjs.org
      - name: Install mihome plugin dependencies
        working-directory: plugins/com.ulanzi.mihome.ulanziPlugin
        run: npm install --registry https://registry.npmjs.org
      - name: Install template dependencies
        working-directory: template/com.example.hello.ulanziPlugin
        run: npm install --registry https://registry.npmjs.org
      - name: Run tests
        run: npm test
